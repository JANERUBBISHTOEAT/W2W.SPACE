<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <title>W2W · Update in progress</title>
  <meta name="description" content="W2W is being updated. Please check back later.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --ink: #121212;
      --muted: #707070;
      --line: #e3e3e3;
      --paper: #f7f7f7;
      --yellow: #fecc1b;
      --band-height: min(128px, 14%);
      --stripe-size: 128px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; overflow: hidden; background: var(--paper); }
    body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      display: grid;
      grid-template-rows: var(--band-height) minmax(0, 1fr) var(--band-height);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tape {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--yellow);
    }
    .tape::before {
      position: absolute;
      inset: 0 calc(-1 * var(--stripe-size)) 0 0;
      content: "";
      background-image: linear-gradient(135deg, var(--yellow) 25%, var(--ink) 25%,
        var(--ink) 50%, var(--yellow) 50%, var(--yellow) 75%, var(--ink) 75%);
      background-size: var(--stripe-size) var(--stripe-size);
      animation: tape-slide 6.4s linear infinite;
    }
    .tape--bottom::before { animation-direction: reverse; }
    @keyframes tape-slide { to { transform: translateX(calc(-1 * var(--stripe-size))); } }
    .page {
      position: relative;
      align-self: center;
      justify-self: center;
      width: min(calc(100% - 48px), 552px);
      min-height: 0;
      max-height: 100%;
      overflow: clip;
      padding: 32px 0;
    }
    .brand { display: flex; justify-content: center; margin-bottom: 24px; }
    .brand img { display: block; width: 195px; height: 60px; }
    .maintenance-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      text-align: center;
    }
    .content { padding: 32px 36px; }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 1px #c59e14;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 5.8vw, 34px);
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -.035em;
    }
    .message { margin: 16px 0 24px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .message span { display: block; }
    .refresh {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
      background: #fff;
      color: #146fd1;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      touch-action: manipulation;
    }
    .refresh:hover { border-color: #b8b8b8; background: #fafafa; }
    .refresh svg { flex: none; width: 15px; height: 15px; }
    .refresh:focus-visible, .motion-control:focus-within {
      outline: 2px solid #146fd1;
      outline-offset: 4px;
    }
    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      min-height: 44px;
      margin-top: 12px;
      margin-bottom: 6px;
      margin-inline: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .domain { letter-spacing: .025em; }
    .motion-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .motion-control input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--ink);
      scroll-margin-block: 16px;
    }
    body:has(#pause-motion:checked) .tape::before { animation-play-state: paused; }
    @supports not selector(body:has(input:checked)) {
      .tape::before { animation: none; }
      .motion-control { display: none; }
    }
    .reduced-motion-note { display: none; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 480px) {
      :root { --band-height: min(104px, 14%); --stripe-size: 112px; }
      .page { width: calc(100% - 40px); padding: 24px 0; }
      .brand { margin-bottom: 20px; }
      .brand img { width: 169px; height: 52px; }
      .content { padding: 28px 24px; }
      .message { font-size: 14px; }
    }
    @media (max-height: 750px) {
      .page { padding-top: 16px; padding-bottom: 16px; }
      .brand { margin-bottom: 16px; }
      .content { padding-top: 24px; padding-bottom: 24px; }
      .eyebrow { margin-bottom: 12px; }
      .message { margin-top: 12px; margin-bottom: 18px; line-height: 1.65; }
      .page-footer { margin-top: 4px; }
    }
    @media (max-height: 520px) {
      .page { padding-top: 12px; padding-bottom: 12px; }
      .brand { margin-bottom: 8px; }
      .brand img { width: 143px; height: 44px; }
      .content { padding-top: 16px; padding-bottom: 16px; }
      .eyebrow { margin-bottom: 8px; font-size: 10px; }
      h1 { font-size: clamp(22px, 4vw, 28px); }
      .message { margin-top: 10px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; }
      .page-footer { margin-top: 0; font-size: 12px; }
    }
    @media (max-height: 650px) and (min-width: 600px) {
      .page {
        display: grid;
        grid-template-columns: 136px minmax(0, 1fr);
        column-gap: 20px;
        width: min(calc(100% - 48px), 760px);
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .brand { grid-column: 1; grid-row: 1; align-self: center; margin: 0; }
      .brand img { width: 136px; height: auto; }
      .maintenance-card { grid-column: 2; grid-row: 1; min-width: 0; }
      .content { padding: 12px 20px; }
      .eyebrow { display: none; }
      h1 { font-size: 24px; }
      .message { margin: 8px 0 10px; }
      .page-footer { grid-column: 1 / -1; margin-top: 0; }
    }
    @media (max-height: 650px) and (width < 600px) {
      .page { padding-top: 6px; padding-bottom: 6px; }
      .brand { margin-bottom: 6px; }
      .brand img { width: 117px; height: 36px; }
      .content { padding: 12px 18px; }
      .eyebrow { display: none; }
      h1 { font-size: 24px; }
      .message { margin: 8px 0 12px; }
      .message span:first-child { display: none; }
    }
    @media (max-height: 360px) and (width < 600px) {
      .page { padding-top: 4px; padding-bottom: 4px; }
      .brand { margin-bottom: 4px; }
      .brand img { width: 91px; height: 28px; }
      .content { padding-top: 8px; padding-bottom: 8px; }
      h1 { font-size: 22px; }
      .message { margin: 6px 0 8px; font-size: 12px; }
    }
    @media (max-height: 300px) {
      .brand, .message { display: none; }
      .page { display: block; padding-top: 4px; padding-bottom: 4px; }
      .content { padding: 8px 18px; }
      .eyebrow { display: none; }
      h1 { font-size: 22px; }
    }
    @media (max-height: 220px) {
      .page { padding-top: 0; padding-bottom: 0; }
      .content { padding-top: 4px; padding-bottom: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tape::before { animation: none; }
      #pause-motion, .motion-control { display: none; }
      .reduced-motion-note { display: inline; }
    }
    @media print {
      html, body { height: auto; overflow: visible; }
      body { --band-height: 64px; }
      .page { max-height: none; overflow: visible; }
      .tape::before { animation: none; }
      #pause-motion, .motion-control, .refresh { display: none; }
    }
  </style>
</head>
