# Managed by the opt-in W2W maintenance tool. ACME locations stay outside this hook.
location / {
    error_page 503 =503 /__W2W_MAINTENANCE_DOCUMENT__;
    return 503;
}
location = /__W2W_MAINTENANCE_DOCUMENT__ {
    internal;
    alias /usr/share/nginx/html/__W2W_MAINTENANCE_DIRECTORY__/index.html;
    default_type text/html;
    charset utf-8;
    add_header Retry-After "120" always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security $sts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
